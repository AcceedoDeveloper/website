<header class="top-bar">
  <div class="left-section">
    <span class="brand-title">ACCEEDO</span>
  </div>

  <!-- Search Bar -->
  <div class="search-bar">
    <input type="text" placeholder="Search..." [(ngModel)]="searchQuery" (input)="onSearch()" />
    <i class="fa fa-search search-icon"></i>
  </div>

  <div class="right-icons" #loginDropdown>
    <!-- Notification -->
    <div class="notification-icon">
      <img
        [src]="hasNotification
          ? 'https://cdn-icons-png.flaticon.com/128/594/594838.png'
          : 'https://cdn-icons-png.flaticon.com/128/17383/17383017.png'"
        alt="Notification"
        class="notification-bell"
      />
    </div>

    <!-- Profile Dropdown -->
    <div class="login-dropdown">
      <label class="login-icon" (click)="toggleDropdown()">
        <ng-container *ngIf="userData?.photoURL && userData.photoURL !== 'assets/default-avatar.png'; else initialsIcon">
          <img [src]="userData.photoURL" alt="User Avatar" class="avatar" />
        </ng-container>
        <ng-template #initialsIcon>
          <div class="user-initial">
            {{ getInitials(userData?.UserName || userData?.email || '') }}
          </div>
        </ng-template>
      </label>

      <div class="login-menu">
        <p><strong>{{ userData?.UserName || 'Username' }}</strong></p>
        <p>{{ userData?.role || 'Role' }}</p>
        <button class="edit-btn" (click)="openEditProfile()">Edit Profile</button>
        <a href="#" (click)="signOut()">Sign Out</a>
      </div>
    </div>
  </div>
</header>

<!-- Profile Edit Modal -->
<div class="modal" *ngIf="showEditModal">
  <div class="modal-content">
    <h3>Edit Profile Picture</h3>
    <div class="profile-edit-wrapper">
      <div *ngIf="previewImage" class="profile-preview-wrapper">
        <img [src]="previewImage" class="profile-preview-img" />
      </div>
      <input type="file" (change)="onPhotoSelected($event)" />
    </div>
    
        <!-- RIGHT: User Info -->
        <div class="info-section">
          <div class="top-row">
            <div class="form-group">
              <label>Name</label>
              <input type="text" formControlName="name" placeholder="Full name" />
            </div>
            <div class="form-group">
              <label>Username</label>
              <input type="text" formControlName="userName" placeholder="Username" />
            </div>
          </div>

          <div class="middle-row">
            <div class="form-group">
              <label>User Code</label>
              <input type="text" formControlName="userCode" placeholder="User Code" />
            </div>
            <div class="form-group">
  <label>Role</label>
  <select formControlName="role">
    <option value="">-- Select Role --</option>
    <option *ngFor="let r of roles" [value]="r.role">{{ r.role }}</option>
  </select>
</div>

            <div class="form-group">
              <label>Email</label>
              <input type="email" formControlName="emailId" placeholder="Email address" />
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" formControlName="phoneNumber" placeholder="Phone number" />
            </div>
          </div>

          <div class="bottom-row">
            <div class="form-group">
              <label>Department</label>
              <select formControlName="departmentName" (change)="onDepartmentChange($event)">
                <option value="">-- Select Department --</option>
                <option *ngFor="let d of departments" [value]="d.departmentName">{{ d.departmentName }}</option>
              </select>
            </div>
            <div class="form-group">
              <label>SubDepartment</label>
              <select formControlName="subDepartmentName">
                <option value="">-- Select SubDepartment --</option>
                <option *ngFor="let sd of subDepartmentsData" [value]="sd.name">{{ sd.name }}</option>
              </select>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" formControlName="password" placeholder="Password" />
            </div>
          </div>
        </div>
           <div class="form-buttons">
      <button type="button" (click)="saveProfilePicture()">Save</button>
      <button type="button" (click)="closeEditModal()">Cancel</button>
    </div>
  </div>
      </div>


   


<!-- Sidebar -->
<aside class="sidebar">
  <h3 class="menu-title">Menu</h3>
  <ul class="menu-list">
    <li *ngIf="isAdmin()">
      <div class="menu-section">
        <input type="checkbox" id="master-toggle" class="section-toggle" hidden>
        <label for="master-toggle" class="section-title">
          Master <i class="fa fa-chevron-down"></i>
        </label>
        <div class="submenu">
          <a routerLink="/register">User</a>
          <a routerLink="/department">Department</a>
          <a routerLink="/role">Role</a>
          <a routerLink="/create">Create Project</a>
        </div>
      </div>
    </li>
    <li>
      <a routerLink="/projects">Projects</a>
    </li>
    <li>
      <div class="menu-section">
        <input type="checkbox" id="frontend-toggle" class="section-toggle" hidden>
        <label for="frontend-toggle" class="section-title">
          Frontend <i class="fa fa-chevron-down"></i>
        </label>
        <div class="submenu">
          <a routerLink="/webdev">WebDev</a>
          <a routerLink="/angulardeveloper">Angular Developer</a>
          <a routerLink="/ngrx">NGRX</a>
        </div>
      </div>
    </li>
    <li>
      <div class="menu-section">
        <input type="checkbox" id="backend-toggle" class="section-toggle" hidden>
        <label for="backend-toggle" class="section-title">
          Backend <i class="fa fa-chevron-down"></i>
        </label>
        <div class="submenu">
          <a routerLink="/node">Node.js</a>
          <a routerLink="/api&database">API & Database</a>
        </div>
      </div>
    </li>
    <li>
      <a href="#">Full Stack</a>
    </li>
  </ul>
</aside>
