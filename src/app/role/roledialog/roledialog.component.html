
  <!-- Delete Confirmation Dialog -->
  <div class="form-card delete-confirmation" *ngIf="isDeleteMode">
    <h2>{{ data?.title || 'Confirm Deletion' }}</h2>
    
    <div class="delete-message">
      <p>{{ data?.message || 'Are you sure you want to delete this role? This action cannot be undone.' }}</p>
    </div>

    <div class="form-actions">
      <button type="button" class="btn danger" (click)="confirmDelete()">
        Delete
      </button>
      <button type="button" class="btn secondary" (click)="cancelDelete()">
        Cancel
      </button>
    </div>
  </div>

  <!-- Create/Edit Role Dialog -->
  <div class="form-card" [class.loading]="isLoading" *ngIf="!isDeleteMode">
    <h2>{{ isEdit ? 'Edit Role' : 'Create Role' }}</h2>

    <form class="main" [formGroup]="roleform" (ngSubmit)="saveroledata()" [class.loading]="isLoading">
      <!-- Role Input -->
      <div class="form-group">
        <label for="role">Role</label>
        <input 
          type="text" 
          placeholder="Enter the Role" 
          id="role" 
          formControlName="role" 
        />
        <span class="error" *ngIf="vrole?.invalid && vrole?.touched">
          Please enter role
        </span>
      </div>

      <!-- Buttons -->
      <div class="form-actions">
        <button type="submit" class="btn primary" [disabled]="roleform.invalid || isLoading">
          <span *ngIf="!isLoading">{{ isEdit ? 'Update' : 'Save' }}</span>
          <span *ngIf="isLoading">Saving...</span>
        </button>
        <button type="button" class="btn secondary" (click)="resetForm()" [disabled]="isLoading">
          Cancel
        </button>
      </div>
    </form>
  </div>
