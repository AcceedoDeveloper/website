<app-header></app-header>

<div class="maincontent">
    
       <!-- Welcome Header -->
       <div class="welcome-card">
         <div class="date-time">
           <img src="https://cdn-icons-png.flaticon.com/128/10692/10692035.png" alt="Calendar Icon" class="calendar-icon" />
           <span>{{ dateTime }}</span>
         </div>
         <div class="user-welcome">
           <span>Welcome, {{ userData?.UserName?.toUpperCase() || 'User' }}</span>  

         </div>
       </div>
       <div>
        <svg width="0" height="0">
  <defs>
    <clipPath id="circle-shape" clipPathUnits="objectBoundingBox">
      <circle cx="0.5" cy="0.5" r="0.5" />
    </clipPath>
  </defs>
</svg>

<img class="user-icon" [src]="userData?.photoURL || ''" alt="" 
     style="clip-path: url(#circle-shape);" />
       </div>

       
       <div class="section-header">
           <div class="">
           
            </div>


            <!-- show role -->
        
    
   <div class="role-wrapper">
  <div class="role-header">
    <h2>Roles</h2>
    <button class="add-role-btn" (click)="getrole()">+</button>
  </div>

  <div class="role-table-wrapper">
    <table class="role-flat-table">
      <thead>
        <tr>
          <th>Role</th>
          <th class="action-col">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let itemrole of roledata">
          <td>{{ itemrole.role }}</td>
<td>
  <button mat-icon-button class="black-btn" (click)="editrole(itemrole)">
    <mat-icon>edit</mat-icon>
  </button>

  <button mat-icon-button class="black-btn" (click)="deleterole(itemrole._id)">
    <mat-icon>delete</mat-icon>
  </button>
</td>




        </tr>
      </tbody>
    </table>

    <div *ngIf="roledata.length === 0" class="empty-state">
      <p>No roles available. Start by adding one.</p>
    </div>
  </div>
</div>

    
   
     
   
   
         
      
  
   
   
      </div>
</div>
