
<div class="container">
<h2 class="dialog-title">
  {{ isEditMode ? 'Edit Permission' : 'Create Permission' }}
</h2>

<div class="dialog-content">
  <form [formGroup]="permissionForm" class="permission-form">

    <!-- Top Fields -->
    <div class="form-grid">

      <div class="form-group">
        <label>Role Name <span class="required">*</span></label>
        <select formControlName="role" class="form-select">
          <option value="">Select Role</option>
          <option *ngFor="let r of roles"
                  [value]="r._id || r.id || r.roleId || r.role || r.name">
            {{ r.role || r.name || r }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Initial Screen<span class="required">*</span></label>
        <select formControlName="initialScreen" class="form-select">
          <option value="">No Screen</option>
          <option *ngFor="let screen of initialScreenOptions" [value]="screen.route">
            {{ screen.label }}
          </option>
        </select>
      </div>

    </div>

    <!-- Section Title -->
    <h3 class="section-heading">Permissions Access</h3>

    <div formGroupName="screens" class="permission-wrapper">

      <!-- Master -->
      <div class="permission-card">
        <h4>Master Module</h4>
        <div formGroupName="master" class="toggle-group">

          <label class="toggle">
            <input type="checkbox" formControlName="user">
            <span class="slider"></span>
            <span>User Management</span>
          </label>

          <label class="toggle">
            <input type="checkbox" formControlName="role">
            <span class="slider"></span>
            <span>Role Management</span>
          </label>

          <label class="toggle">
            <input type="checkbox" formControlName="createProject">
            <span class="slider"></span>
            <span>Create Project</span>
          </label>

          <label class="toggle">
            <input type="checkbox" formControlName="permission">
            <span class="slider"></span>
            <span>Permission</span>
          </label>

        </div>
      </div>

      <!-- Project -->
      <div class="permission-card">
        <h4>Project</h4>
        <label class="toggle">
          <input type="checkbox" formControlName="project">
          <span class="slider"></span>
          <span>Enable Project Access</span>
        </label>
      </div>

      <!-- Frontend -->
      <div class="permission-card">
        <h4>Frontend</h4>
        <div formGroupName="frontend" class="toggle-group">

          <label class="toggle">
            <input type="checkbox" formControlName="webdev">
            <span class="slider"></span>
            <span>Web Development</span>
          </label>

          <label class="toggle">
            <input type="checkbox" formControlName="angularDeveloper">
            <span class="slider"></span>
            <span>Angular Developer</span>
          </label>

          <label class="toggle">
            <input type="checkbox" formControlName="ngrx">
            <span class="slider"></span>
            <span>NgRx</span>
          </label>

        </div>
      </div>

      <!-- Backend -->
      <div class="permission-card">
        <h4>Backend</h4>
        <div formGroupName="backend" class="toggle-group">

          <label class="toggle">
            <input type="checkbox" formControlName="node">
            <span class="slider"></span>
            <span>Node.js</span>
          </label>

          <label class="toggle">
            <input type="checkbox" formControlName="apiDatabase">
            <span class="slider"></span>
            <span>API + Database</span>
          </label>

        </div>
      </div>

    </div>

  </form>
</div>

<div class="dialog-actions">
  <button class="btn-cancel" (click)="onCancel()">Cancel</button>
  <button class="btn-primary"
          [disabled]="permissionForm.invalid || loading"
          (click)="onSubmit()">
    {{ loading ? 'Saving...' : (isEditMode ? 'Update' : 'Create') }}
  </button>
</div>
</div>
