<app-header></app-header>

<div class="maincontent">

  <!-- Welcome Card -->
  <div class="welcome-card"> 
    <div class="date-time">
      <img src="https://cdn-icons-png.flaticon.com/128/10692/10692035.png" alt="Calendar Icon" class="calendar-icon" />
      <span>{{ dateTime }}</span>
    </div>
    <div class="user-welcome">
      <span>Welcome, {{ userData?.UserName?.toUpperCase() || 'User' }}</span>  
    </div>
  </div>

  <!-- User Avatar -->
  <div>
    <svg width="0" height="0">
      <defs>
        <clipPath id="circle-shape" clipPathUnits="objectBoundingBox">
          <circle cx="0.5" cy="0.5" r="0.5" />
        </clipPath>
      </defs>
    </svg>

    <img class="user-icon" [src]="userData?.photoURL || ''" alt="User Avatar" 
         style="clip-path: url(#circle-shape);" />
  </div>

  <!-- Project list -->
  <div class="projects-list" style="margin-top: 20px;">
    <ul>
      <li *ngFor="let project of filteredProjects" class="project-item">
        {{ project.projectName || project.name || 'Untitled Project' }}
      </li>
    </ul>
  </div>

</div>

<app-footer></app-footer>
