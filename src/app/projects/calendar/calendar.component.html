<div class="Month-view">
  <div class="container">

    <div class="data-filter-bar">

      <div class="filter-item">
        <label for="assignee">Assignee</label>
        <select id="assignee" [(ngModel)]="selectedAssignee" (change)="generateCalendar()">
          <option value="">All</option>
          <option *ngFor="let emp of allAssignees" [value]="emp">{{ emp }}</option>
        </select>
      </div>

      <div class="filter-item">
        <label for="month">Month</label>
        <select id="month" [(ngModel)]="selectedMonth" (change)="generateCalendar()">
          <option *ngFor="let m of months; let i = index" [value]="i">{{ m }}</option>
        </select>
      </div>

      <div class="filter-item">
        <label for="year">Year</label>
        <select id="year" [(ngModel)]="selectedYear" (change)="generateCalendar()">
          <option *ngFor="let y of years" [value]="y">{{ y }}</option>
        </select>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-color red"></div>
        <span>Weekend</span>
      </div>
    </div>
    <div class="main-content">
      <div class="calendar">
        <div class="day-header">
          <div>Monday</div>
          <div>Tuesday</div>
          <div>Wednesday</div>
          <div>Thursday</div>
          <div>Friday</div>
          <div>Saturday</div>
          <div>Sunday</div>
        </div>

        <div class="calendar-grid">
          <div 
            class="day-cell" 
            *ngFor="let day of days" 
            (click)="selectDay(day)"
            [class.clickable]="day.tasks.length > 0"
          >
            <div class="day-number" [ngClass]="{ sunday: day.isSunday }">
              {{ day.date }}
            </div>

            <div class="task" *ngIf="day.tasks.length > 0">
              <span class="task-title">{{ day.tasks[0]?.title }}<span *ngIf="day.tasks.length > 1">...</span></span>
            </div>
          </div>
        </div>
      </div>
      <div class="holidays" *ngIf="selectedDayTasks.length > 0">
        <div class="holidays-title">
          Tasks for {{ selectedDay?.date }}/{{ selectedMonth + 1 }}/{{ selectedYear }}
        </div>
        <div class="task-list">
          <div class="task" *ngFor="let task of selectedDayTasks">
            <b>{{ task.title }}</b>
            <span *ngIf="!selectedAssignee"> - {{ task.assignee }}</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
