<div class="Month-view">
  <div class="container">
    <!-- Project Info Display -->


    <div class="data-filter-bar">
      <div class="filter-item">

        <select [(ngModel)]="selectedAssignee" (change)="onAssigneeChange()">
          <option value="">All Assignees</option>
          <option *ngFor="let name of allAssignees" [value]="name">{{ name }}</option>
        </select>
      </div>
      <div class="legend">
        <div class="legend-item">
          <div class="legend-color red"></div>
          <span>Weekend</span>
        </div>
        <div class="legend-item">
          <div class="legend-color blue"></div>
          <span>Has Tasks</span>
        </div>
      </div>
   
    </div>


    <div class="main-content">
      <div class="calendar-container" [class.has-selection]="selectedDayTasks.length > 0">
        <div class="calendar">
          <div class="day-header">
            <div>Monday</div>
            <div>Tuesday</div>
            <div>Wednesday</div>
            <div>Thursday</div>
            <div>Friday</div>
            <div>Saturday</div>
            <div>Sunday</div>
          </div>

          <div class="calendar-grid">
            <div 
              class="day-cell" 
              *ngFor="let day of days" 
              (click)="selectDay(day)"
              [class.clickable]="day.tasks.length > 0"
              [class.has-tasks]="day.tasks.length > 0"
              [class.sunday]="day.isSunday"
            >
              <div class="day-number">
                {{ day.date }}
              </div>

            <div class="task" *ngIf="day.tasks.length > 0">
                <span class="task-title">{{ day.tasks[0]?.title }}<span *ngIf="day.tasks.length > 1">...</span></span>
              </div>
            </div>
          </div>
        </div>

        <div class="task-sidebar" *ngIf="selectedDayTasks.length > 0">
          <div class="task-details">
            <div class="task-details-title">
              Tasks for {{ selectedDay?.date }}/{{ selectedMonth + 1 }}/{{ selectedYear }}
            </div>
            <div class="task-list">
              <div class="task-item" *ngFor="let task of selectedDayTasks">
                <div class="task-title"><b>{{ task.title }}</b></div>
                <div class="task-meta">
                  <span class="assignee">Assignee: {{ task.assignee }}</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="no-tasks-message" *ngIf="selectedDay && selectedDayTasks.length === 0">
          No tasks found for selected day.
        </div>
      </div>
    </div>
  </div>
</div>
