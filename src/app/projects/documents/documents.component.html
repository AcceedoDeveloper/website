<!-- Documents Section -->
<div class="maindocument" >
  <div class="task-controls">
    <button class="pill-btn" (click)="opendocpop()">
      + Add Documents
    </button>
  </div>

  <!-- Add Document Popup -->
  <div class="documentpop" *ngIf="showdocumentpop">
    <div class="upload-form" [formGroup]="documentForm">
      <span class="close-btn" (click)="showdocumentpop = false">&times;</span>

      <div class="form-group">
        <label for="title">Title</label>
        <mat-form-field appearance="outline" class="full-width1">
          <input
            id="title"
            type="text"
            matInput
            formControlName="title"
            placeholder="Enter or select title"
            [matAutocomplete]="auto"
            (input)="filterTitles()"
          />
          <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onTitleSelected($event)">
            <mat-option *ngFor="let title of filteredTitles" [value]="title">
              {{ title }}
            </mat-option>
          </mat-autocomplete>
          <mat-error *ngIf="documentForm.get('title')?.hasError('required')">
            Title is required
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-group">
        <label for="file">Upload File (optional for edit)</label>
        <input id="file" type="file" (change)="onFileSelected($event)" />
      </div>

      <button type="button" (click)="submitDocument()">
        {{ editingDocument ? 'Update' : 'Submit' }}
      </button>
    </div>
  </div>

  <!-- Document List -->
  <div class="document-list" *ngIf="documents.length">
    <div *ngFor="let doc of documents; let docIndex = index">
      <!-- Section Title -->
      <h3 class="list-title">Uploaded Documents - {{ doc.title }}</h3>

      <!-- Grid Container -->
      <div class="document-container">
        <div class="document-box" *ngFor="let file of doc.files; let fileIndex = index">
          <div class="document-header">
            <h6 class="doc-title">{{ file }}</h6>
            <div class="action-buttons">
              <!-- Download -->
              <a mat-icon-button [href]="getFileUrl(file)" target="_blank" aria-label="Download file">
                <mat-icon>download</mat-icon>
              </a>
              <!-- Delete -->
        <button mat-icon-button color="warn" (click)="deleteDocument(doc._id)" aria-label="Delete file">
  <mat-icon>delete</mat-icon>
</button>
            </div>
          </div>

          <!-- Preview Section -->
          <div class="preview-container">
            <ng-container *ngIf="getFileType(file) === 'pdf'">
              <div *ngIf="!loadError[file] && isPdfLoaded[file]; else pdfError">
                <pdf-viewer
                  [src]="getFileUrl(file)"
                  [render-text]="false"
                  [show-all]="false"
                  [page]="1"
                  [original-size]="true"
                  style="width: 100%; height: 200px;"
                  (after-load-complete)="onPdfLoad(file)"
                  (error)="onPdfError(file, $event)"
                ></pdf-viewer>
              </div>
              <ng-template #pdfError>
                <div class="pdf-error-placeholder">
                  <p>Unable to load PDF preview</p>
                </div>
              </ng-template>
            </ng-container>

            <ng-container *ngIf="getFileType(file) === 'image'">
              <img [src]="getSafeFileUrl(file)" alt="Image Preview" class="image-preview" />
            </ng-container>

            <ng-container *ngIf="getFileType(file) === 'excel'">
              <div class="excel-placeholder">
                <img src="assets/excel-icon.png" alt="Excel Icon" class="file-icon" />
                <p>Excel File (Preview not available)</p>
              </div>
            </ng-container>

            <ng-container *ngIf="getFileType(file) === 'other'">
              <div class="other-placeholder">
                <p>File Preview not supported</p>
              </div>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
