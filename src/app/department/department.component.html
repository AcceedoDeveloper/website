<app-header></app-header>

  <div class="maincontent">
    
       <!-- Welcome Header -->
       <div class="welcome-card">
         <div class="date-time">
           <img src="https://cdn-icons-png.flaticon.com/128/10692/10692035.png" alt="Calendar Icon" class="calendar-icon" />
           <span>{{ dateTime }}</span>
         </div>
         <div class="user-welcome">
           <span>Welcome, {{ userData?.UserName?.toUpperCase() || 'User' }}</span>  

         </div>
       </div>
       <div>
        <svg width="0" height="0">
  <defs>
    <clipPath id="circle-shape" clipPathUnits="objectBoundingBox">
      <circle cx="0.5" cy="0.5" r="0.5" />
    </clipPath>
  </defs>
</svg>

<img class="user-icon" [src]="userData?.photoURL || ''" alt="" 
     style="clip-path: url(#circle-shape);" />
       </div>
<div class="department-container">
  <div class="department-header">
    <h2>Departments</h2>
    <button class="add-department-btn"  (click)="showdepartment()">+ Add Department</button>
  </div>

  <div class="department-table-wrapper">
    <table class="department-table">
      <thead>
        <tr>
          <th>Department</th>
          <th>Subdepartments</th>
          <th class="action-col">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of showdm">
          <td>{{ item.departmentName }}</td>
          <td>
            <ul class="sub-list">
              <li *ngFor="let sub of item.subDepartments">{{ sub.name }}</li>
            </ul>
          </td>
      <td>
  <!-- Edit Department -->
  <button mat-icon-button class="black-btn" (click)="editdepartment(item)">
    <mat-icon>edit</mat-icon>
  </button>

  <!-- Delete Department -->
  <button mat-icon-button class="black-btn" (click)="deletedm(item._id)">
    <mat-icon>delete</mat-icon>
  </button>
</td>

        </tr>
      </tbody>
    </table>

    <div *ngIf="showdm.length === 0" class="empty-state">
      No departments found. Start by adding one.
    </div>
  </div>
</div>

      
       <!-- Hidden Checkbox to Control Modal -->
       <input type="checkbox" id="modal-toggle" hidden />
   

</div>
