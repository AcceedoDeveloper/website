<div class="simulator-container">

  <div class="equation-box">
    I = {{ current }} A
  </div>

  <div class="slider-group">

    <div class="slider-label">
      <span>Source Voltage (Vs)</span>
      <span>{{ voltage }} V</span>
    </div>

    <input
      type="range"
      min="2"
      max="24"
      step="0.5"
      [(ngModel)]="voltage"
      (input)="updateCircuit()">

  </div>

  <div class="slider-group">

    <div class="slider-label">
      <span>Resistance (R)</span>
      <span>{{ resistance }} Ω</span>
    </div>

    <input
      type="range"
      min="2"
      max="20"
      step="0.5"
      [(ngModel)]="resistance"
      (input)="updateCircuit()">

  </div>

  <svg
    width="100%"
    height="280"
    viewBox="0 0 360 260">

    <defs>

      <path
        #circuitPath
        d="M 60 130 L 60 40 L 300 40 L 300 220 L 60 220 Z">
      </path>

    </defs>

    <use
      href="#circuitPath">
    </use>

    <path
      d="M 60 130 L 60 40 L 300 40 L 300 220 L 60 220 Z"
      class="wire">
    </path>

    <!-- Electrons -->
    <g #electronCloud></g>

    <!-- Battery -->
    <g transform="translate(40,110)">

      <rect
        x="0"
        y="0"
        width="40"
        height="40"
        rx="5"
        class="battery">
      </rect>

      <text
        x="14"
        y="26"
        class="battery-text">
        +
      </text>

    </g>

    <!-- Resistor -->
    <g [attr.transform]="resistorTransform">

      <rect
        x="110"
        y="22"
        width="80"
        height="36"
        rx="6"
        class="resistor-back">
      </rect>

      <rect
        x="125"
        y="22"
        width="6"
        height="36"
        class="resistor-band">
      </rect>

      <rect
        x="145"
        y="22"
        width="6"
        height="36"
        fill="#8e44ad">
      </rect>

      <rect
        x="165"
        y="22"
        width="6"
        height="36"
        fill="#e74c3c">
      </rect>

    </g>

  </svg>

</div>
