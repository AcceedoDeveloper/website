<div class="widget-container">
  <h2>Interactive Diode Bias Simulator</h2>
  
  <div class="circuit-canvas">
    <!-- SVG Circuit Canvas (Ensures Perfect Alignment) -->
    <svg class="circuit-svg" viewBox="0 0 600 260">
      
      <!-- WIRES -->
      <g fill="none" stroke="#7f8c8d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <!-- Top Left to Top Center -->
        <path d="M 120,105 L 120,60 L 200,60"/>
        <!-- Top Center to Top Right -->
        <path d="M 400,60 L 480,60 L 480,105"/>
        <!-- Bottom Right to Bottom Left -->
        <path d="M 480,155 L 480,200 L 120,200 L 120,155"/>
      </g>

      <!-- BATTERY NODE (Left) -->
      <g transform="translate(65, 105)">
        <!-- Top Yellow Positive Cap -->
        <rect x="42" y="-5" width="30" height="10" fill="#f1c40f" rx="3" />
        <rect x="42" y="-5" width="30" height="10" fill="none" stroke="#f1c40f" stroke-width="1.5" rx="3" filter="drop-shadow(0 0 5px #f1c40f)"/>
        <text x="42" y="-5" fill="#1a252f" font-size="10" font-weight="bold" text-anchor="middle">+</text>
        
        <!-- Battery Body -->
        <rect x="45" y="5" width="24" height="30" fill="#2c3e50" rx="2" />
        <rect x="45" y="5" width="24" height="30" fill="none" stroke="#7f8c8d" stroke-width="1.5" rx="2" />
        
        <!-- Bottom White Negative Cap -->
        <rect x="42" y="35" width="30" height="10" fill="#ecf0f1" rx="3" />
        <text x="42" y="35" fill="#1a252f" font-size="10" font-weight="bold" text-anchor="middle">-</text>
        
        <!-- Voltage Text -->
        <text x="80" y="10" fill="#f1c40f" font-size="20" font-weight="bold">+</text>
        <text x="100" y="30" fill="#f1c40f" font-size="20" font-weight="bold">{{ voltage.toFixed(1) }}V</text>
        <text x="83" y="50" fill="#f1c40f" font-size="20" font-weight="bold">-</text>
      </g>

      <!-- DIODE NODE (Center Top) -->
      <g transform="translate(200, 30)">
        <rect x="0" y="0" width="200" height="60" fill="#2c3e50" stroke="#3498db" stroke-width="2" rx="6"/>
        <rect x="0" y="0" width="200" height="60" fill="none" stroke="#3498db" stroke-width="2" rx="6" filter="drop-shadow(0 0 8px rgba(52,152,219,0.3))"/>
        
        <!-- Diode Inner Content -->
        <g transform="translate(48, 12)">
          <!-- Left Sign -->
          <text x="0" y="20" fill="#ecf0f1" font-size="16" font-weight="bold">{{ diodeLeftSign }}</text>
          
          <!-- Diode Symbol — rotates 180° in reverse bias to flip the triangle direction -->
          <g [attr.transform]="isForwardBias ? 'translate(15, 5)' : 'translate(65, 35) rotate(180)'">
            <path d="M 15,5 L 15,25 L 35,15 Z" fill="#fff"/>
            <line x1="35" y1="5" x2="35" y2="25" stroke="#fff" stroke-width="3"/>
            <line x1="0" y1="15" x2="15" y2="15" stroke="#fff" stroke-width="2"/>
            <line x1="35" y1="15" x2="50" y2="15" stroke="#fff" stroke-width="2"/>
          </g>
          
          <!-- Right Sign -->
          <text x="80" y="20" fill="#ecf0f1" font-size="16" font-weight="bold">{{ diodeRightSign }}</text>
        </g>
        
        <!-- Label -->
        <text x="100" y="50" fill="#bdc3c7" font-size="10" text-anchor="middle">{{ diodeBiasLabel }}</text>
      </g>

      <!-- LOAD NODE (Right) -->
      <g transform="translate(490, 130)">
        <rect x="-45" y="-30" width="90" height="60" fill="#2c3e50" stroke="#7f8c8d" stroke-width="2" rx="6"/>
        <rect x="-45" y="-30" width="90" height="60" fill="none" [attr.stroke]="isForwardBias ? '#2ecc71' : '#7f8c8d'" stroke-width="2" rx="6" [attr.filter]="isForwardBias ? 'drop-shadow(0 0 10px rgba(46,204,113,0.6))' : 'none'"/>
        
        <text x="0" y="-2" [attr.fill]="isForwardBias ? '#2ecc71' : '#7f8c8d'" font-size="22" font-weight="bold" text-anchor="middle">{{ isForwardBias ? 'ON' : 'OFF' }}</text>
        <text x="0" y="15" fill="#a6b0b7" font-size="10" text-anchor="middle">CIRCUIT LOAD</text>
      </g>

      <!-- ELECTRON PARTICLES -->
      <circle class="electron-particle" r="5" fill="#f1c40f" filter="drop-shadow(0 0 4px #f1c40f)" [style.animation-duration]="animationDuration" *ngIf="animationDuration !== '0s'"></circle>
      <circle class="electron-particle" r="5" fill="#f1c40f" filter="drop-shadow(0 0 4px #f1c40f)" [style.animation-duration]="animationDuration" style="animation-delay: -0.4s" *ngIf="animationDuration !== '0s'"></circle>
      <circle class="electron-particle" r="5" fill="#f1c40f" filter="drop-shadow(0 0 4px #f1c40f)" [style.animation-duration]="animationDuration" style="animation-delay: -0.8s" *ngIf="animationDuration !== '0s'"></circle>
      <circle class="electron-particle" r="5" fill="#f1c40f" filter="drop-shadow(0 0 4px #f1c40f)" [style.animation-duration]="animationDuration" style="animation-delay: -1.2s" *ngIf="animationDuration !== '0s'"></circle>
      <circle class="electron-particle" r="5" fill="#f1c40f" filter="drop-shadow(0 0 4px #f1c40f)" [style.animation-duration]="animationDuration" style="animation-delay: -1.6s" *ngIf="animationDuration !== '0s'"></circle>
      <circle class="electron-particle" r="5" fill="#f1c40f" filter="drop-shadow(0 0 4px #f1c40f)" [style.animation-duration]="animationDuration" style="animation-delay: -2.0s" *ngIf="animationDuration !== '0s'"></circle>
      
    </svg>
  </div>

  <!-- Controls -->
  <div class="toggle-container">
    <span class="toggle-label">Circuit State / Polarity:</span>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-weight: bold;" [ngClass]="toggleColorClass">{{ toggleText }}</span>
      <label class="switch">
        <input type="checkbox" [checked]="isForwardBias" (change)="toggleBias()">
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <div class="control-group">
    <label>Source Amplitude (V) <span class="label-val c-blue">{{ voltage.toFixed(1) }} V</span></label>
    <input type="range" min="1" max="30" step="0.5" [value]="voltage" (input)="onVoltageChange($event)">
  </div>

  <div class="math-panel">
    <div class="formula-row">
      <span class="sym">Diode State Operating Region</span>
      <span class="calc">{{ mathStateDesc }}</span>
      <span class="res" [ngClass]="mathBiasClass">{{ mathBiasStatus }}</span>
    </div>
    <div class="formula-row">
      <span class="sym">Diode Internal Resistance (Rd)</span>
      <span class="calc">{{ mathResEquation }}</span>
      <span class="res" [ngClass]="mathResClass">{{ mathResVal }}</span>
    </div>
    <hr>
    <div class="formula-row">
      <span class="sym">Circuit Loop Current (I)</span>
      <span class="calc">{{ mathCurrCalc }}</span>
      <span class="res" [ngClass]="mathCurrValClass">{{ current.toFixed(2) }} A</span>
    </div>
  </div>
</div>
