<app-footr></app-footr>
<div class="login-container">
  <div class="login-box">
    <h2>Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label>Username</label>
        <input type="text" formControlName="username" placeholder="Enter username" />
        <div *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.hasError('required')" class="error">
          Username is required
        </div>
      </div>
      

      <div class="input-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Enter password" />
          <button type="button" class="toggle-btn" (click)="togglePasswordVisibility()">
            {{ hidePassword ? '👁️' : '🙈' }}
          </button>
        </div>
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')" class="error">
          Password is required
        </div>
      </div>

      <div *ngIf="message" class="error-message">{{ message }}</div>

      <button type="submit" class="submit-btn">Login</button>
    </form>
  </div>
</div>
<app-footer></app-footer>
