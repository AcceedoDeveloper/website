
<!-- top bar -->
<header class="top-bar">
  <div class="left-section">
    <span class="brand-title">ACCEEDO</span>
  </div>

  <!-- Search Bar -->
  <div class="search-bar">
    <input
      type="text"
      placeholder="Search..."
      [(ngModel)]="searchQuery"
      (input)="onSearch()" />
    <i class="fa fa-search search-icon"></i>
  </div>

  <div class="right-icons">
    <!-- Notification Bell -->
    <div class="notification-icon">
      <img
        [src]="hasNotification
          ? 'https://cdn-icons-png.flaticon.com/128/594/594838.png'
          : 'https://cdn-icons-png.flaticon.com/128/17383/17383017.png'"
        alt="Notification"
        class="notification-bell" />
    </div>


    <!-- Login Dropdown -->
    <div class="login-dropdown">
      <input type="checkbox" id="toggle-login" hidden />
      <label for="toggle-login" class="login-icon">
        <ng-container *ngIf="userData?.photoURL && userData.photoURL ; else initialsIcon">
          <img [src]="userData.photoURL" alt="" class="avatar" />
        </ng-container>
        <ng-template #initialsIcon>
          <div class="user-initial">
            {{ getInitials(userData?.username || userData?.email || '') }}
          </div>
        </ng-template>
      </label>

      <div class="login-menu">
        <p><strong>{{ userData?.username || 'Username' }}</strong></p>
        <p>{{ userData?.role || 'Role' }}</p>
        <button class="edit-btn" (click)="openEditProfile()">Edit Profile</button>
        <a href="#" (click)="signOut()">Sign Out</a>
      </div>
    </div>
  </div>
</header>

       <!-- Profile Edit Modal -->
<div class="modal" *ngIf="showEditModal">
  <div class="modal-content">
    <h3>Edit Profile</h3>

 <form class="grid-form">
      <!-- Row 1 -->
<!-- Combine First + Last Name in one grid cell -->
<div class="form-group first-last-combined">
  <label>First name:</label>
  <input type="text" [(ngModel)]="editUserData.firstName" name="firstName" />

  <label style="margin-top: 30px;">Last name:</label>
  <input type="text" [(ngModel)]="editUserData.lastName" name="lastName" />
</div>

<!-- Profile remains as-is in the right cell -->
<div class="form-group">
 <div *ngIf="previewImage" class="profile-preview-wrapper">
    <img [src]="previewImage" class="profile-preview-img" />
  </div>
  <input type="file" (change)="onPhotoSelected($event)" />
  
</div>


 

      <!-- Row 3 -->
      <div class="form-group">
        <label>Email:</label>
        <input type="email" [(ngModel)]="editUserData.email" name="email" />
      </div>
      <div class="form-group">
        <label>User name:</label>
        <input type="text" [(ngModel)]="editUserData.username" name="username" />
      </div>

      <!-- Row 4 -->
      <div class="form-group">
        <label>Mobile:</label>
        <input type="text" [(ngModel)]="editUserData.mobile" name="mobile" />
      </div>
      <div class="form-group">
        <label>Password:</label>
        <input type="password" [(ngModel)]="editUserData.Password" name="Password" />
      </div>

      <!-- Row 5 -->
      <div class="form-group">
        <label>Role:</label>
        <input type="text" [(ngModel)]="editUserData.role" name="role" />
      </div>
      <div></div>

      <!-- Row 6: Buttons centered -->
      <div class="form-buttons" style="grid-column: span 2;">
        <button type="button" (click)="saveProfilePicture()">Save</button>
        <button type="button" (click)="closeEditModal()">Cancel</button>
      </div>
    </form>

  </div>
</div>
